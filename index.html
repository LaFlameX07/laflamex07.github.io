<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amit Murkalmath — Data Engineer</title>
<meta name="description" content="Amit Murkalmath — Data Engineer, ML, automation. UMD-bound MS Data Science, Aug 2026." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
  (function () {
    const saved = localStorage.getItem("theme");
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    const theme = saved || (prefersDark ? "dark" : "light");
    if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>

<style>
  :root {
    --bg: #efece4;
    --ink: #161614;
    --ink-soft: #4a4a47;
    --ink-faded: #7f7f7a;
    --rule: #161614;
    --rule-soft: #c8c4ba;
    --accent: #c84b1f;
    --pop-bg: #161614;
    --pop-ink: #efece4;
  }
  [data-theme="dark"] {
    --bg: #131310;
    --ink: #efece4;
    --ink-soft: #b0aea4;
    --ink-faded: #6e6c64;
    --rule: #efece4;
    --rule-soft: #2c2b27;
    --accent: #e26a3e;
    --pop-bg: #efece4;
    --pop-ink: #131310;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection { background: var(--ink); color: var(--bg); }
  a { color: inherit; text-decoration: none; }

  /* ─── NAV ─────────────────────────── */
  nav.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--rule);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    gap: 1rem;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 40;
  }
  nav.top .brand { color: var(--ink); font-weight: 500; }
  nav.top .brand .cat { color: var(--ink-faded); margin-left: 0.6rem; font-weight: 400; }
  nav.top .links { display: flex; gap: 1.5rem; align-items: center; }
  nav.top .links a { color: var(--ink-faded); transition: color 0.15s; }
  nav.top .links a:hover { color: var(--accent); }
  nav.top .theme-btn {
    background: transparent;
    border: 1px solid var(--rule-soft);
    color: var(--ink-faded);
    font: inherit;
    font-size: 10px;
    padding: 0.3rem 0.6rem;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.15s;
  }
  nav.top .theme-btn:hover { color: var(--accent); border-color: var(--accent); }
  @media (max-width: 720px) {
    nav.top { padding: 1rem 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
    nav.top .brand .cat { display: none; }
    nav.top .links { gap: 1rem; font-size: 10px; }
  }

  /* ─── HERO ─────────────────────── */
  .hero { padding: 5rem 2rem 4rem; }
  .hero .meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-faded);
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .hero .meta::before {
    content: "";
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: pulse 2.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .display {
    font-family: "Archivo Black", "Impact", sans-serif;
    text-transform: uppercase;
    line-height: 0.9;
    letter-spacing: -0.025em;
    font-size: clamp(2.8rem, 11vw, 9rem);
    color: var(--ink);
  }
  .display .accent { color: var(--accent); }
  .hero .tagline {
    margin-top: 2rem;
    max-width: 36rem;
    font-size: clamp(1.05rem, 1.6vw, 1.25rem);
    color: var(--ink-soft);
    line-height: 1.55;
  }
  @media (max-width: 640px) {
    .hero { padding: 3rem 1.25rem 2.5rem; }
  }

  /* ─── SECTION HEAD ──────────────── */
  .section-head {
    padding: 4rem 2rem 1.5rem;
    border-top: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  .section-head h2 {
    font-family: "Archivo Black", sans-serif;
    text-transform: uppercase;
    font-size: clamp(1.6rem, 5vw, 3.2rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
  }
  .section-head .count {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-faded);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  @media (max-width: 640px) {
    .section-head { padding: 2.5rem 1.25rem 1rem; }
  }

  /* ─── ABOUT ────────────────────── */
  .about {
    padding: 2rem 2rem 4rem;
    display: grid;
    grid-template-columns: 12rem 1fr;
    gap: 3rem;
  }
  .about .lbl {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-faded);
    padding-top: 0.3rem;
  }
  .about p {
    max-width: 38rem;
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .about p strong { color: var(--ink); font-weight: 500; }
  .about p + p { margin-top: 1rem; }
  @media (max-width: 720px) {
    .about { grid-template-columns: 1fr; gap: 1rem; padding: 1.5rem 1.25rem 2.5rem; }
  }

  /* ─── ENTRY ROW ──── */
  .entry {
    display: grid;
    grid-template-columns: 4rem 1fr 14rem;
    gap: 2rem;
    padding: 1.5rem 2rem;
    border-top: 1px solid var(--rule-soft);
    align-items: start;
    transition: background 0.15s;
  }
  .entry:hover { background: rgba(22,22,20,0.04); }
  [data-theme="dark"] .entry:hover { background: rgba(239,236,228,0.04); }
  .entry .num {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--ink-faded);
    letter-spacing: 0.05em;
    padding-top: 0.5rem;
  }
  .entry .body h3 {
    font-family: "Archivo Black", sans-serif;
    text-transform: uppercase;
    font-size: clamp(1.15rem, 2vw, 1.5rem);
    line-height: 1.1;
    letter-spacing: -0.005em;
    margin-bottom: 0.35rem;
  }
  .entry .body h3 a { color: inherit; }
  .entry .body h3 a:hover { color: var(--accent); }
  .entry .body h3 .arrow {
    display: inline-block;
    transition: transform 0.2s;
    margin-left: 0.4rem;
    color: var(--ink-faded);
    font-family: "Space Grotesk", sans-serif;
    font-size: 0.85em;
  }
  .entry:hover .body h3 .arrow { transform: translateX(4px); color: var(--accent); }
  .entry .body p {
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.55;
    max-width: 48rem;
    margin-top: 0.3rem;
  }
  .entry .body p + p { margin-top: 0.3rem; }
  .entry .body .stack {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-faded);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 0.6rem;
  }
  .entry .right {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink-faded);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-top: 0.5rem;
    line-height: 1.6;
    text-align: right;
  }
  .entry .right strong { color: var(--ink); font-weight: 500; }
  @media (max-width: 900px) {
    .entry { grid-template-columns: 2.5rem 1fr; gap: 1.25rem; padding: 1.25rem 1.25rem; }
    .entry .right { grid-column: 2; text-align: left; padding-top: 0.4rem; }
  }

  /* ─── REMIX CREDITS ────────────── */
  .cert-list { padding: 0 2rem 2rem; }
  .cert-group {
    display: grid;
    grid-template-columns: 12rem 1fr;
    gap: 2rem;
    padding: 1rem 0;
    border-top: 1px solid var(--rule-soft);
  }
  .cert-group .gname {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    padding-top: 0.2rem;
  }
  .cert-group ul {
    list-style: none;
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--ink-soft);
  }
  @media (max-width: 640px) {
    .cert-list { padding: 0 1.25rem 1.5rem; }
    .cert-group { grid-template-columns: 1fr; gap: 0.3rem; }
  }

  /* ─── STACK ────────────────────── */
  .stack-block { padding: 0 2rem 2rem; }
  .stack-grid {
    display: grid;
    grid-template-columns: 12rem 1fr;
    gap: 0.6rem 2rem;
    padding: 1rem 0 0;
  }
  .stack-grid dt {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-faded);
    padding-top: 0.2rem;
  }
  .stack-grid dd { color: var(--ink-soft); font-size: 0.95rem; line-height: 1.6; }
  @media (max-width: 640px) {
    .stack-block { padding: 0 1.25rem 1.5rem; }
    .stack-grid { grid-template-columns: 1fr; gap: 0.2rem; }
    .stack-grid dd { margin-bottom: 0.6rem; }
  }

  /* ─── CONTACT / FOOTER ─────────── */
  .contact {
    padding: 5rem 2rem 3rem;
    border-top: 1px solid var(--rule);
    text-align: center;
  }
  .contact .big {
    font-family: "Archivo Black", sans-serif;
    text-transform: uppercase;
    font-size: clamp(2rem, 7vw, 5rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
  }
  .contact .big a { color: var(--accent); text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 3px; }
  .contact .email {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--ink-faded);
    margin-bottom: 2rem;
    letter-spacing: 0.04em;
  }
  .contact .socials {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.5rem 2rem;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .contact .socials a { color: var(--ink-faded); border-bottom: 1px solid var(--rule-soft); padding-bottom: 2px; }
  .contact .socials a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  @media (max-width: 640px) {
    .contact { padding: 3rem 1.25rem 2rem; }
  }
  .footer {
    padding: 1.5rem 2rem;
    border-top: 1px solid var(--rule);
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--ink-faded);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .footer .infl { color: var(--ink-soft); text-align: right; }
  @media (max-width: 640px) {
    .footer { flex-direction: column; gap: 0.4rem; padding: 1.25rem; }
    .footer .infl { text-align: left; }
  }

  /* ─── NOW PLAYING (pill + popup) ──── */
  .player {
    position: fixed;
    bottom: 1.2rem; right: 1.2rem;
    background: var(--pop-bg);
    color: var(--pop-ink);
    padding: 0.55rem 0.9rem 0.55rem 0.6rem;
    display: flex; align-items: center; gap: 0.65rem;
    max-width: 260px;
    z-index: 50;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s;
    user-select: none;
    border: none;
  }
  .player:hover { transform: translateY(-2px); }
  .player .bars {
    display: flex; gap: 2px; align-items: flex-end;
    height: 10px; flex-shrink: 0;
  }
  .player .bars span {
    width: 2px; background: var(--accent);
    animation: eq 0.9s ease-in-out infinite;
  }
  .player .bars span:nth-child(1) { animation-delay: 0s;   height: 60%; }
  .player .bars span:nth-child(2) { animation-delay: 0.2s; height: 100%; }
  .player .bars span:nth-child(3) { animation-delay: 0.4s; height: 40%; }
  .player .bars span:nth-child(4) { animation-delay: 0.6s; height: 80%; }
  @keyframes eq { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1);transform-origin:bottom} }
  .player .info { min-width: 0; line-height: 1.3; }
  .player .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .artist {
    color: color-mix(in srgb, currentColor 60%, transparent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 9px; margin-top: 1px;
  }

  /* popup */
  .popup-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    display: none;
    align-items: center; justify-content: center;
    padding: 1rem;
    animation: fadeIn 0.2s ease-out;
  }
  .popup-backdrop.open { display: flex; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

  .popup {
    background: var(--pop-bg);
    color: var(--pop-ink);
    padding: 1.5rem;
    max-width: 320px;
    width: 100%;
    border-radius: 8px;
    text-align: center;
    position: relative;
    animation: popIn 0.25s cubic-bezier(0.2,0.7,0.3,1.2);
  }
  @keyframes popIn { from { transform: scale(0.9); opacity: 0 } to { transform: scale(1); opacity: 1 } }

  .popup .close {
    position: absolute;
    top: 0.75rem; right: 0.75rem;
    background: transparent;
    border: none;
    color: color-mix(in srgb, currentColor 60%, transparent);
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    padding: 0.3rem 0.5rem;
    transition: color 0.15s;
  }
  .popup .close:hover { color: var(--accent); }

  .popup .label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: color-mix(in srgb, currentColor 60%, transparent);
    margin-bottom: 1rem;
  }
  .popup .cover {
    display: block;
    width: 220px; height: 220px;
    margin: 0 auto 1.25rem;
    border-radius: 4px;
    object-fit: cover;
    background: linear-gradient(135deg, #e8825a, #c84b1f 60%, #6a1f08);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: none;
  }
  .popup .cover:hover {
    transform: scale(1.03);
    box-shadow: 0 12px 30px -6px rgba(0,0,0,0.4);
  }
  .popup .track {
    font-family: "Archivo Black", sans-serif;
    text-transform: uppercase;
    font-size: 1.15rem;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 0.3rem;
  }
  .popup .artist-name {
    font-size: 14px;
    color: color-mix(in srgb, currentColor 70%, transparent);
    margin-bottom: 0.2rem;
  }
  .popup .album-name {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: color-mix(in srgb, currentColor 55%, transparent);
    margin-bottom: 1rem;
  }
  .popup .hint {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
  }
  .popup .hint::after { content: " →"; }
</style>
</head>
<body>

<nav class="top">
  <div class="brand">
    <span id="brand-name">Amit Murkalmath</span><span class="cat">CAT# AM-001</span>
  </div>
  <div class="links">
    <a href="#about">about</a>
    <a href="#work">work</a>
    <a href="#projects">projects</a>
    <a href="#contact">contact</a>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Toggle theme">
      <span id="theme-label">dark</span>
    </button>
  </div>
</nav>

<main id="root"></main>

<!-- now playing pill -->
<button class="player" id="player" aria-label="Now playing — click to expand">
  <div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="info">
    <div class="title" id="np-title">—</div>
    <div class="artist" id="np-artist">—</div>
  </div>
</button>

<!-- popup -->
<div class="popup-backdrop" id="popup-backdrop">
  <div class="popup" role="dialog" aria-labelledby="popup-title">
    <button class="close" id="popup-close" aria-label="Close">×</button>
    <div class="label">Now Spinning</div>
    <a href="#" target="_blank" rel="noopener" id="popup-link">
      <img class="cover" id="popup-cover" alt="Album cover" src="">
    </a>
    <div class="track" id="popup-title">—</div>
    <div class="artist-name" id="popup-artist">—</div>
    <div class="album-name" id="popup-album">—</div>
    <div class="hint">Tap cover to open in Spotify</div>
  </div>
</div>

<script src="data.js"></script>
<script>
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => (
    { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]
  ));

  function render(d) {
    const m = d.meta;
    document.getElementById("brand-name").textContent = m.name;

    const root = document.getElementById("root");

    // hero meta — no "open Aug '26"
    const heroMeta = `LP / ${esc(m.album_year)} · ${esc(m.location)}`;

    // split name into first / last for stacked hero
    const parts = m.name.trim().split(/\s+/);
    const first = parts[0];
    const last = parts.slice(1).join(" ");

    /* HERO */
    const hero = `
      <section class="hero">
        <div class="meta">${heroMeta}</div>
        <h1 class="display">
          ${esc(first)}<br>
          <span class="accent">${esc(last || "")}</span>
        </h1>
        <p class="tagline">${esc(d.hero.tagline)}</p>
      </section>
    `;

    /* ABOUT */
    const about = `
      <section class="about" id="about">
        <div class="lbl">About</div>
        <div>${d.about.body.map(p => `<p>${esc(p)}</p>`).join("")}</div>
      </section>
    `;

    /* WORK */
    const work = `
      <div class="section-head" id="work">
        <h2>Selected Work</h2>
        <div class="count">${d.experience.length} ROLES</div>
      </div>
      ${d.experience.map((e, i) => `
        <article class="entry">
          <div class="num">${String(i+1).padStart(2, "0")}</div>
          <div class="body">
            <h3>${esc(e.role)}</h3>
            ${e.bullets.map(b => `<p>${esc(b)}</p>`).join("")}
          </div>
          <div class="right">
            <strong>${esc(e.org)}</strong><br>
            ${esc(extractDates(e.place))}<br>
            ${esc(extractLocation(e.place))}
          </div>
        </article>
      `).join("")}
    `;

    /* PROJECTS */
    const projects = `
      <div class="section-head" id="projects">
        <h2>Selected Projects</h2>
        <div class="count">${d.projects.length} SHIPPED</div>
      </div>
      ${d.projects.map((p, i) => `
        <article class="entry">
          <div class="num">${String(i+1).padStart(2, "0")}</div>
          <div class="body">
            <h3><a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.subtitle || p.title)} <span class="arrow">↗</span></a></h3>
            <p>${esc(p.body)}</p>
            <div class="stack">${esc(p.stack)}</div>
          </div>
          <div class="right">${esc(p.title || "")}</div>
        </article>
      `).join("")}
    `;

    /* PUBLICATIONS */
    const pubs = `
      <div class="section-head">
        <h2>Publications</h2>
        <div class="count">${d.publications.length} PAPERS</div>
      </div>
      ${d.publications.map((p, i) => `
        <article class="entry">
          <div class="num">${String(i+1).padStart(2, "0")}</div>
          <div class="body">
            <h3>${p.link && p.link !== "#" ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)} <span class="arrow">↗</span></a>` : esc(p.title)}</h3>
            <p>${esc(p.desc)}</p>
          </div>
          <div class="right">${esc(p.label || "")}</div>
        </article>
      `).join("")}
    `;

    /* EDUCATION */
    const edu = `
      <div class="section-head">
        <h2>Education</h2>
        <div class="count">${d.education.length} INSTITUTIONS</div>
      </div>
      ${d.education.map((e, i) => `
        <article class="entry">
          <div class="num">${String(i+1).padStart(2, "0")}</div>
          <div class="body">
            <h3>${esc(e.school)}</h3>
            <p>${esc(e.degree)}${e.detail ? " · " + esc(e.detail) : ""}</p>
          </div>
          <div class="right">${esc(extractDates(e.place))}</div>
        </article>
      `).join("")}
    `;

    /* REMIX CREDITS */
    const certs = `
      <div class="section-head">
        <h2>Remix Credits</h2>
        <div class="count">${d.remix_credits.reduce((n,g) => n + g.items.length, 0)} CERTIFICATIONS</div>
      </div>
      <div class="cert-list">
        ${d.remix_credits.map(g => `
          <div class="cert-group">
            <div class="gname">${esc(g.group)}</div>
            <ul>${g.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
          </div>
        `).join("")}
      </div>
    `;

    /* STACK */
    const stack = `
      <div class="section-head">
        <h2>Stack</h2>
        <div class="count">INSTRUMENTS</div>
      </div>
      <div class="stack-block">
        <dl class="stack-grid">
          ${d.stack.map(s => `<dt>${esc(s.k)}</dt><dd>${esc(s.v)}</dd>`).join("")}
        </dl>
      </div>
    `;

    /* CONTACT */
    const contact = `
      <section class="contact" id="contact">
        <div class="big">Let's<br><a href="mailto:${esc(m.email)}">talk →</a></div>
        <div class="email">${esc(m.email)}</div>
        <div class="socials">
          <a href="${esc(m.socials.github)}" target="_blank" rel="noopener">GITHUB</a>
          <a href="${esc(m.socials.linkedin)}" target="_blank" rel="noopener">LINKEDIN</a>
          <a href="${esc(m.socials.leetcode)}" target="_blank" rel="noopener">LEETCODE</a>
          <a href="${esc(m.socials.spotify)}" target="_blank" rel="noopener">SPOTIFY</a>
        </div>
      </section>
      <footer class="footer">
        <span>© ${esc(m.album_year)} ${esc(m.name)}</span>
        <span class="infl">${esc(d.influences || "")}</span>
      </footer>
    `;

    root.innerHTML = hero + about + work + projects + pubs + edu + certs + stack + contact;
  }

  // helpers to split "Mumbai · Mar '26 — Jun '26" → "Mar '26 — Jun '26" and "Mumbai"
  function extractDates(place) {
    if (!place) return "";
    const parts = String(place).split(" · ");
    // dates are usually the part containing an apostrophe-year
    const dateLike = parts.find(p => /'\d{2}/.test(p));
    return dateLike || parts[parts.length - 1] || "";
  }
  function extractLocation(place) {
    if (!place) return "";
    const parts = String(place).split(" · ");
    const dateLike = parts.find(p => /'\d{2}/.test(p));
    return parts.filter(p => p !== dateLike).join(" · ") || "";
  }

  function setupNowPlaying(d) {
    const list = d.now_playing_rotation || [];
    if (!list.length) return;
    const current = list[Math.floor(Math.random() * list.length)];

    document.getElementById("np-title").textContent = (current.track || "").toUpperCase();
    document.getElementById("np-artist").textContent = (current.artist || "").toUpperCase();

    const backdrop = document.getElementById("popup-backdrop");
    const fallbackCover = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23e8825a'/><stop offset='0.6' stop-color='%23c84b1f'/><stop offset='1' stop-color='%236a1f08'/></linearGradient></defs><rect width='100' height='100' fill='url(%23g)'/></svg>";

    document.getElementById("player").addEventListener("click", () => {
      document.getElementById("popup-cover").src = current.cover || fallbackCover;
      const link = current.spotify || d.meta.socials.spotify || "#";
      document.getElementById("popup-link").href = link;
      document.getElementById("popup-title").textContent = current.track || "";
      document.getElementById("popup-artist").textContent = current.artist || "";
      document.getElementById("popup-album").textContent = [current.album, current.year].filter(Boolean).join(" · ");
      backdrop.classList.add("open");
    });

    document.getElementById("popup-close").addEventListener("click", e => {
      e.stopPropagation(); backdrop.classList.remove("open");
    });
    backdrop.addEventListener("click", e => {
      if (e.target === backdrop) backdrop.classList.remove("open");
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") backdrop.classList.remove("open");
    });
  }

  function setupThemeToggle() {
    const btn = document.getElementById("theme-btn");
    const lbl = document.getElementById("theme-label");
    const sync = () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      lbl.textContent = dark ? "light" : "dark";
    };
    sync();
    btn.addEventListener("click", () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      if (dark) { document.documentElement.removeAttribute("data-theme"); localStorage.setItem("theme","light"); }
      else { document.documentElement.setAttribute("data-theme","dark"); localStorage.setItem("theme","dark"); }
      sync();
    });
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const d = await loadData();
    render(d);
    setupNowPlaying(d);
    setupThemeToggle();
  });
</script>

</body>
</html>
