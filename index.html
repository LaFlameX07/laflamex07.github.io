<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amit Murkalmath</title>
<meta name="description" content="Amit Murkalmath — Data Engineer. ML, automation, data systems." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  // bootstrap theme before paint
  (function () {
    const saved = localStorage.getItem("theme");
    const prefersDark = window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;
    const theme = saved || (prefersDark ? "dark" : "light");
    if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>

<style>
  :root {
    --bg: #f5f3ef;
    --ink: #1a1a1a;
    --ink-soft: #4a4a48;
    --ink-faded: #8a8a86;
    --rule: #d8d4cc;
    --accent: #1a1a1a;
    --accent-hover: #b85a3e;
    --player-bg: #1a1a1a;
    --player-ink: #f5f3ef;
  }
  [data-theme="dark"] {
    --bg: #141413;
    --ink: #ebe8e1;
    --ink-soft: #a8a59d;
    --ink-faded: #6a6862;
    --rule: #2a2826;
    --accent: #ebe8e1;
    --accent-hover: #d49a7e;
    --player-bg: #ebe8e1;
    --player-ink: #141413;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding: 4rem 1.5rem 6rem;
  }
  ::selection { background: var(--ink); color: var(--bg); }

  a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    transition: border-color 0.15s, color 0.15s;
  }
  a:hover { color: var(--accent-hover); border-bottom-color: var(--accent-hover); }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
  }

  /* ─── TOP NAV ─────────────────────────────── */
  nav.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4rem;
    font-size: 13px;
    color: var(--ink-soft);
  }
  nav.top .who { color: var(--ink); font-weight: 500; }
  nav.top .who a { border-bottom: none; }
  nav.top .right { display: flex; gap: 1.25rem; align-items: center; }
  nav.top .right a { border-bottom: none; color: var(--ink-soft); }
  nav.top .right a:hover { color: var(--accent-hover); }

  .theme-toggle {
    background: transparent;
    border: none;
    color: var(--ink-soft);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .theme-toggle:hover { color: var(--accent-hover); }

  /* ─── HERO ───────────────────────────────── */
  .hero h1 {
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 0.75rem;
    letter-spacing: -0.01em;
  }
  .hero p {
    color: var(--ink-soft);
    margin-bottom: 1rem;
    max-width: 32rem;
  }
  .hero .location {
    font-size: 13px;
    color: var(--ink-faded);
    margin-top: 1.5rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .hero .location::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent-hover);
  }

  /* ─── SECTIONS ──────────────────────────── */
  section { margin-top: 3.5rem; }

  section h2 {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-faded);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 1.5rem;
  }

  /* ─── ENTRY (used for experience, projects, education, pubs) ─ */
  .entry {
    display: grid;
    grid-template-columns: 5rem 1fr;
    gap: 1.5rem;
    padding: 0.85rem 0;
  }
  .entry + .entry { border-top: 1px solid var(--rule); }

  .entry .date {
    font-size: 13px;
    color: var(--ink-faded);
    padding-top: 0.1rem;
    font-variant-numeric: tabular-nums;
  }
  .entry .body {
    min-width: 0;
  }
  .entry h3 {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 0.15rem;
  }
  .entry h3 a {
    border-bottom: none;
    color: var(--ink);
  }
  .entry h3 a:hover {
    color: var(--accent-hover);
  }
  .entry h3 a::after {
    content: " →";
    color: var(--ink-faded);
    font-weight: 400;
  }
  .entry .meta {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
  }
  .entry p {
    color: var(--ink-soft);
    margin-bottom: 0.4rem;
    font-size: 14px;
  }
  .entry .stack {
    font-size: 13px;
    color: var(--ink-faded);
    margin-top: 0.3rem;
  }

  @media (max-width: 520px) {
    .entry { grid-template-columns: 1fr; gap: 0.3rem; }
    .entry .date { padding-top: 0; }
  }

  /* ─── ABOUT body uses entry layout w/o the date column ─── */
  .about p {
    color: var(--ink-soft);
    margin-bottom: 1rem;
    max-width: 36rem;
  }

  /* ─── STACK list ──────────────────────────── */
  .stack-list {
    display: grid;
    grid-template-columns: 5rem 1fr;
    gap: 0.4rem 1.5rem;
  }
  .stack-list dt {
    font-size: 13px;
    color: var(--ink-faded);
    padding-top: 0.1rem;
  }
  .stack-list dd {
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.55;
  }
  @media (max-width: 520px) {
    .stack-list { grid-template-columns: 1fr; gap: 0.1rem; }
    .stack-list dd { margin-bottom: 0.6rem; }
  }

  /* ─── REMIX / CERTS ────────────────────── */
  .cert-group {
    display: grid;
    grid-template-columns: 5rem 1fr;
    gap: 0.4rem 1.5rem;
    padding: 0.6rem 0;
  }
  .cert-group + .cert-group { border-top: 1px solid var(--rule); }
  .cert-group .label {
    font-size: 13px;
    color: var(--ink-faded);
    padding-top: 0.15rem;
  }
  .cert-group ul {
    list-style: none;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.65;
  }
  @media (max-width: 520px) {
    .cert-group { grid-template-columns: 1fr; gap: 0.1rem; }
  }

  /* ─── CONTACT FOOTER ────────────────────── */
  .contact {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--rule);
  }
  .contact p { color: var(--ink-soft); margin-bottom: 1rem; }
  .contact .links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem 1.5rem;
    font-size: 14px;
  }
  .contact .links a { color: var(--ink-soft); }

  .colophon {
    margin-top: 3rem;
    font-size: 12px;
    color: var(--ink-faded);
  }

  /* ─── NOW PLAYING ───────────────────────── */
  .player {
    position: fixed;
    bottom: 1.2rem; right: 1.2rem;
    background: var(--player-bg);
    color: var(--player-ink);
    padding: 0.55rem 0.85rem;
    display: flex; align-items: center; gap: 0.65rem;
    max-width: 280px;
    z-index: 50;
    border-radius: 999px;
    font-size: 12px;
    box-shadow: 0 8px 24px -12px rgba(0,0,0,0.25);
  }
  .player .bars {
    display: flex; gap: 2px; align-items: flex-end;
    height: 10px;
  }
  .player .bars span {
    width: 2px; background: var(--player-ink);
    animation: eq 0.9s ease-in-out infinite;
    opacity: 0.85;
  }
  .player .bars span:nth-child(1) { animation-delay: 0s;   height: 60%; }
  .player .bars span:nth-child(2) { animation-delay: 0.2s; height: 100%; }
  .player .bars span:nth-child(3) { animation-delay: 0.4s; height: 40%; }
  .player .bars span:nth-child(4) { animation-delay: 0.6s; height: 80%; }
  @keyframes eq {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); transform-origin: bottom; }
  }
  .player .info { min-width: 0; line-height: 1.25; }
  .player .title {
    font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .player .artist {
    color: color-mix(in srgb, currentColor 65%, transparent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 11px;
  }
  @media (max-width: 520px) {
    .player { bottom: 0.8rem; right: 0.8rem; max-width: 220px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <nav class="top">
    <span class="who"><a href="/">Amit Murkalmath</a></span>
    <span class="right">
      <a href="https://github.com/LaFlameX07" target="_blank" rel="noopener">github</a>
      <a href="https://www.linkedin.com/in/amit-murkalmath/" target="_blank" rel="noopener">linkedin</a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
        <span id="theme-label">dark</span>
      </button>
    </span>
  </nav>

  <main id="root"></main>

</div>

<aside class="player" aria-label="Now playing">
  <div class="bars" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>
  <div class="info">
    <div class="title" id="np-title">—</div>
    <div class="artist" id="np-artist">—</div>
  </div>
</aside>

<script src="data.js"></script>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]
  ));

  // pick a random now-playing entry on each load
  function pickNow(list) {
    if (!Array.isArray(list) || !list.length) return null;
    return list[Math.floor(Math.random() * list.length)];
  }

  // turn "Mumbai · Mar '26 — Jun '26" into just "'26"
  // (we already have the readable form in meta; here we extract a short tag for the date column)
  function shortDate(place) {
    if (!place) return "";
    // find the last apostrophe-year, e.g. '26
    const m = String(place).match(/'(\d{2})(?!.*'\d{2})/);
    if (m) return "'" + m[1];
    return "";
  }

  function render(d) {
    const m = d.meta;

    // now-playing
    const np = pickNow(d.now_playing_rotation);
    if (np) {
      document.getElementById("np-title").textContent = np.track;
      document.getElementById("np-artist").textContent = `${np.artist}`;
    }

    const root = document.getElementById("root");

    /* HERO -------------------------------------------------- */
    const hero = `
      <section class="hero" style="margin-top:0;">
        <h1>${esc(m.name)} — ${esc(m.role)}</h1>
        <p>${esc(d.hero.tagline)}</p>
        <div class="location">${esc(m.location)}</div>
      </section>
    `;

    /* ABOUT ------------------------------------------------- */
    const about = `
      <section class="about">
        <h2>About</h2>
        ${d.about.body.map(p => `<p>${esc(p)}</p>`).join("")}
      </section>
    `;

    /* EXPERIENCE ------------------------------------------- */
    const exp = `
      <section>
        <h2>Experience</h2>
        ${d.experience.map(e => `
          <div class="entry">
            <div class="date">${esc(shortDate(e.place))}</div>
            <div class="body">
              <h3>${esc(e.role)} — ${esc(e.org)}</h3>
              <div class="meta">${esc(e.place)}</div>
              ${e.bullets.map(b => `<p>${esc(b)}</p>`).join("")}
            </div>
          </div>
        `).join("")}
      </section>
    `;

    /* PROJECTS --------------------------------------------- */
    const proj = `
      <section>
        <h2>Selected projects</h2>
        ${d.projects.map(p => `
          <div class="entry">
            <div class="date"></div>
            <div class="body">
              <h3><a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.subtitle || p.title)}</a></h3>
              <p>${esc(p.body)}</p>
              <div class="stack">${esc(p.stack)}</div>
            </div>
          </div>
        `).join("")}
      </section>
    `;

    /* PUBLICATIONS ----------------------------------------- */
    const pubs = `
      <section>
        <h2>Publications</h2>
        ${d.publications.map(p => `
          <div class="entry">
            <div class="date"></div>
            <div class="body">
              <h3>${p.link && p.link !== "#" ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title)}</h3>
              <p>${esc(p.desc)}</p>
            </div>
          </div>
        `).join("")}
      </section>
    `;

    /* EDUCATION -------------------------------------------- */
    const edu = `
      <section>
        <h2>Education</h2>
        ${d.education.map(e => `
          <div class="entry">
            <div class="date">${esc(shortDate(e.place))}</div>
            <div class="body">
              <h3>${esc(e.school)}</h3>
              <div class="meta">${esc(e.degree)} · ${esc(e.place)}</div>
              ${e.detail ? `<p>${esc(e.detail)}</p>` : ""}
            </div>
          </div>
        `).join("")}
      </section>
    `;

    /* CERTIFICATIONS --------------------------------------- */
    const certs = `
      <section>
        <h2>Certifications</h2>
        ${d.remix_credits.map(g => `
          <div class="cert-group">
            <div class="label">${esc(g.group)}</div>
            <ul>
              ${g.items.map(i => `<li>${esc(i)}</li>`).join("")}
            </ul>
          </div>
        `).join("")}
      </section>
    `;

    /* STACK ------------------------------------------------ */
    const stack = `
      <section>
        <h2>Stack</h2>
        <dl class="stack-list">
          ${d.stack.map(s => `<dt>${esc(s.k)}</dt><dd>${esc(s.v)}</dd>`).join("")}
        </dl>
      </section>
    `;

    /* CONTACT ---------------------------------------------- */
    const contact = `
      <section class="contact">
        <h2>Contact</h2>
        <p>Open to roles in data engineering, ML, and automation from Aug '26.</p>
        <div class="links">
          <a href="mailto:${esc(m.email)}">${esc(m.email)}</a>
          <a href="${esc(m.socials.github)}" target="_blank" rel="noopener">github</a>
          <a href="${esc(m.socials.linkedin)}" target="_blank" rel="noopener">linkedin</a>
          <a href="${esc(m.socials.leetcode)}" target="_blank" rel="noopener">leetcode</a>
          <a href="${esc(m.socials.spotify)}" target="_blank" rel="noopener">spotify</a>
        </div>
        <p class="colophon">© ${esc(m.album_year)} ${esc(m.name)}</p>
      </section>
    `;

    root.innerHTML = hero + about + exp + proj + pubs + edu + certs + stack + contact;
  }

  function setupThemeToggle() {
    const btn = document.getElementById("theme-toggle");
    const label = document.getElementById("theme-label");
    if (!btn) return;
    const sync = () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      label.textContent = dark ? "light" : "dark";
    };
    sync();
    btn.addEventListener("click", () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      if (dark) {
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("theme", "light");
      } else {
        document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem("theme", "dark");
      }
      sync();
    });
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const d = await loadData();
    render(d);
    setupThemeToggle();
  });
</script>

</body>
</html>
